<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CollaDay — Privacy Policy / Gizlilik Politikası</title>
<style>
  :root { --blue:#1E88E5; --blue2:#33B5FF; --ink:#1E2330; --muted:#5b6472; --line:#e6e9ef; --bg:#ffffff; }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.65; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:760px; margin:0 auto; padding:32px 22px 80px; }
  header { border-bottom:2px solid var(--line); padding-bottom:20px; margin-bottom:8px; }
  h1 { font-size:26px; margin:0 0 6px; letter-spacing:-0.3px; }
  h1 .c { color:var(--blue2); }
  .updated { color:var(--muted); font-size:14px; }
  h2 { font-size:20px; margin:38px 0 4px; color:var(--blue); }
  h3 { font-size:16px; margin:26px 0 6px; }
  p, li { font-size:15.5px; }
  ul { padding-left:22px; }
  li { margin:5px 0; }
  a { color:var(--blue); }
  .lead { font-size:16.5px; }
  .divider { height:1px; background:var(--line); margin:44px 0; border:0; }
  strong { color:var(--ink); }
  footer { margin-top:48px; color:var(--muted); font-size:13px; text-align:center; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e8ebf0; --muted:#9aa3b2; --line:#2a2f3a; --bg:#14161b; --blue:#4aa8ff; }
    strong { color:#fff; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1><span class="c">CollaDay</span> — Gizlilik Politikası / Privacy Policy</h1>
    <div class="updated">Son güncelleme / Last updated: 22.07.2026</div>
  </header>

  
</div>
</body>
</html>
